<!-- Student Horizons - Submark (Visual)
     Variant     : Color on transparent, single-colour mark reads on any background
     Canvas      : 8448 x 8448 px      Mark: 7680 x 7680 px (8K, square)
     Clear space : 384 px all sides = 1/20 (5%) of the mark width

     Every curve in this mark is an exact primitive - two true circles, four
     elliptical arcs and six straight lines. Nothing is a traced approximation,
     so the outline stays perfectly smooth at any scale.

       Ring      true circle, R 403.845, uniform stroke 25.846 units
       Cap       true rhombus, half-diagonals 211.161 x 97.932,
                 edge slope 2.1562, apex and base on the axis
       Cap band  two elliptical arcs, cusps on the axis, left end cut square
       Wings     two elliptical arcs, cusps on the axis, tips tucked 4 units
                 under the ring wall so the join is a true overlap

     The right half is the exact mirror of the left about x = 4224.000.
     Seven subpaths share one nonzero-wound path: overlaps merge without a
     boolean, the ring aperture is a true hole, and every element stays
     independently editable.

     Ink        : Horizon Red #B92A2A - single ink
     Background : none (transparent)
-->
<svg xmlns="http://www.w3.org/2000/svg" width="8448" height="8448"
     viewBox="0 0 8448 8448" role="img" aria-labelledby="sh-title">
  <title id="sh-title">Student Horizons</title>
